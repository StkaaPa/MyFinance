<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyFinance-Configuração</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/configuracao.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">MyFinance-Configuração</div>
        <nav class="menu">
          <a href="dashboard.html">Dashboard</a>
          <a href="contas.html">Contas</a>
          <a href="despesas.html">Despesas</a>
          <a href="receitas.html">Receitas</a>
          <a href="investimentos.html">Investimentos</a>
          <a href="fundo-emergencia.html">Fundo Emergência</a>
          <a href="objetivos.html">Objetivos</a>
          <a href="despesas-anuais.html">Despesas Anuais</a>
          <a href="relatorios.html">Relatórios</a>
        </nav>
        <a href="configuracao.html" class="menu-config active">Configuração</a>
      </aside>
      <main class="content">
        <div class="title-row">
          <h1>Configuração</h1>
        </div>
        <form class="card box config">
          <label>Período financeiro
            <small>Define o dia de início do teu mês financeiro.</small>
            <select name="dia"></select>
          </label>
          <label>Moeda principal
            <select name="moeda">
              <option>EUR - Euro</option>
            </select>
          </label>
          <label>Idioma
            <select name="idioma">
              <option>Português</option>
            </select>
          </label>
          <button type="submit" class="btn-primary">Guardar</button>
        </form>
      </main>
    </div>
    <script src="js/configuracao.js"></script>
  </body>
</html>

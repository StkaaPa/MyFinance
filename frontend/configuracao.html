<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>MyFinance – Configuração</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/componentes.css" />
    <link rel="stylesheet" href="css/configuracao.css" />
  </head>
  <body>
    <div class="app">
      <aside id="sidebar" data-modo="config" data-ativo="configuracao"></aside>

      <main class="content">
        <div class="title-row"><h1>Geral</h1></div>

        <p class="aviso" id="aviso" hidden></p>

        <form class="card form-config" id="form-config">
          <label>
            <span class="rotulo">Período financeiro</span>
            <span class="ajuda"
              >Define o dia de início do teu mês financeiro.</span
            >
            <select name="dia"></select>
          </label>
          <label>
            <span class="rotulo">Moeda principal</span>
            <select name="moeda">
              <option value="EUR">EUR - Euro</option>
            </select>
          </label>
          <label>
            <span class="rotulo">Idioma</span>
            <select name="idioma">
              <option value="pt">Português</option>
            </select>
          </label>
          <div class="rodape-form">
            <button type="submit" class="btn-add" id="btn-guardar">
              Guardar
            </button>
            <span class="ok" id="ok" hidden>Guardado.</span>
          </div>
          <p class="nota-config">
            O dia escolhido é usado para sugerir o período do próximo «Fechar
            mês». Os meses já fechados não mudam.
          </p>
        </form>
      </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/util.js"></script>
    <script src="js/configuracao.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <title>MyFinance-Dashboard</title>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">MyFinance</div>
        <nav class="menu">
          <a href="dashboard.html" class="active">Dashboard</a>
          <a href="contas.html"">Contas</a>
          <a href="despesas.html">Despesas</a>
          <a href="receitas.html">Receitas</a>
          <a href="investimentos.html">Investimentos</a>
          <a href="fundo-emergencia.html">Fundo Emergência</a>
          <a href="objetivos.html">Objetivos</a>
          <a href="despesas-anuais.html">Despesas Anuais</a>
          <a href="relatorio.html">Relatórioz</a>
        </nav>
        <a href="configuracao.html" class="menu-config">Configuração</a>
      </aside>
      <main class="content">
        <div class="tittle-row">
            <h1>Dashboard</h1>
        </div>
        <section class="kpis">
            <article class="card kpi">
                <span class="kpi-label">Património Total</span>
                <strong class="kpi-value" data-campo="patrimonio">—</strong>
            </article>
            <article class="card kpi">
                <span class="kpi-label">Receitas</span>
                <strong class="kpi-value" data-campo="receitas">—</strong>
            </article>
            <article class="card kpi">
                <span class="kpi-label">Despesas</span>
                <strong class="kpi-value" data-campo="despesas">—</strong>
            </article>
            <article class="card kpi">
                <span class="kpi-label">Taxa de Poupança</span>
                <strong class="kpi-value" data-campo="taxa_poupanca">—</strong>
            </article>
        </section>
        <section class="charts">
            <article class="card box">
                <h2>Evolução do Património</h2>
                <div class="placeholder" id="grafico-evolucao">Sem dados</div>
            </article>
            <article class="card box">
                <h2>Distribuição do Património</h2>
                <div class="donut-wrap">
                    <div class="donut">
                        <span data-campo="centro">—</span>
                    </div>
                    <ul class="legend" id="legenda"></ul>
                </div>
            </article>
        </section>
        <section class="banner">
            <p data-campo="fundo_texto">—</p>
            <a href="fundo-emergencia.html" class="btn-primary">Ver detalhes</a>
        </section>
      </main>
    </div>
    <script src="js/dashboard.js"></script>
  </body>
</html>

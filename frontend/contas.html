<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>MyFinance</title>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">MyFinance</div>
        <nav class="menu">
          <a href="dashboard.html">Dashboard</a>
          <a href="contas.html" class="active">Contas</a>
          <a href="despesas.html">Despesas</a>
          <a href="receitas.html">Receitas</a>
          <a href="investimentos.html">Investimentos</a>
          <a href="fundo-emergencia.html">Fundo Emergência</a>
          <a href="objetivos.html">Objetivos</a>
          <a href="despesas-anuais.html">Despesas Anuais</a>
          <a href="relatorio.html">Relatórioz</a>
        </nav>
        <a href="configuracao.html" class="menu-config">Configuração</a>
      </aside>

      <main class="content">
        <div class="tittle-row">
          <h1>Contas</h1>
          <button id="btn-adicionar" class="btn-add">Adicionar Conta</button>
        </div>

        <section class="card tabela-card">
          <table class="tabela">
            <thead>
              <tr>
                <th>Conta</th>
                <th>Instituição</th>
                <th>Saldo</th>
                <th>Tipo</th>
                <th>Ativo</th>
              </tr>
            </thead>
            <tbody id="lista-contas"></tbody>
          </table>
        </section>
      </main>
    </div>

    <dialog id="modal-conta" class="modal">
      <form id="form-conta">
        <h2>Adicionar Conta</h2>
        <label
          >Nome
          <input type="text" name="nome" required />
        </label>
        <label
          >Instituição
          <input type="text" name="instituicao" required />
        </label>
        <label
          >Tipo
          <select name="tipo" required>
            <option value="Conta Ordem">Conta Ordem</option>
            <option value="Poupança">Poupança</option>
            <option value="Investimento">Investimento</option>
            <option value="Reforma">Reforma</option>
          </select>
        </label>

        <p id="erro-conta" class="erro"></p>

        <div class="modal-botoes">
          <button type="button" id="btn-cancel" class="btn-cancelar">
            Cancelar
          </button>
          <button type="submit" class="btn-add">Guardar</button>
        </div>
      </form>
    </dialog>

    <script src="js/contas.js"></script>
  </body>
</html>

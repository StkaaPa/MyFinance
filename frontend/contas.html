<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>MyFinance – Contas</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/componentes.css" />
    <link rel="stylesheet" href="css/contas.css" />
  </head>
  <body>
    <div class="app">
      <aside id="sidebar" data-ativo="contas"></aside>

      <main class="content">
        <div class="title-row">
          <h1>Contas</h1>
          <button class="btn-add" id="btn-adicionar">
            <span class="mais">+</span> Adicionar conta
          </button>
        </div>

        <p class="aviso" id="aviso" hidden></p>

        <section class="card tabela-card">
          <table class="tabela">
            <thead>
              <tr>
                <th>Conta</th>
                <th>Instituição</th>
                <th>Saldo</th>
                <th>Tipo</th>
                <th>Ativo</th>
              </tr>
            </thead>
            <tbody id="lista-contas"></tbody>
          </table>
        </section>
      </main>
    </div>

    <dialog id="modal-conta" class="modal">
      <form id="form-conta">
        <h2>Adicionar conta</h2>
        <label
          >Nome
          <input type="text" name="nome" required />
        </label>
        <label
          >Instituição
          <input type="text" name="instituicao" required />
        </label>
        <label
          >Tipo
          <select name="tipo" required>
            <option value="conta_ordem">Conta à ordem</option>
            <option value="poupanca">Poupança</option>
            <option value="investimento">Investimento</option>
            <option value="reforma">Reforma</option>
          </select>
        </label>
        <p id="erro-conta" class="erro"></p>
        <div class="modal-botoes">
          <button type="button" id="btn-cancelar" class="btn-cancelar">
            Cancelar
          </button>
          <button type="submit" class="btn-add">Guardar</button>
        </div>
      </form>
    </dialog>

    <script src="js/sidebar.js"></script>
    <script src="js/contas.js"></script>
  </body>
</html>

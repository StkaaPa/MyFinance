<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>MyFinance – Investimentos</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/componentes.css" />
    <link rel="stylesheet" href="css/investimentos.css" />
  </head>
  <body>
    <div class="app">
      <aside id="sidebar" data-ativo="investimentos"></aside>

      <main class="content">
        <div class="title-row">
          <h1>Investimentos</h1>
          <div class="acoes">
            <label class="mes-select">
              <select id="mes" aria-label="Mês"></select>
              <svg class="icon" viewBox="0 0 24 24">
                <path
                  d="M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM4 10h16M9 3v4M15 3v4"
                />
              </svg>
            </label>
            <button class="btn-add" id="btn-adicionar">
              <span class="mais">+</span> Adicionar investimento
            </button>
          </div>
        </div>

        <p class="aviso" id="aviso" hidden></p>

        <div class="tabs" id="tabs"></div>

        <div class="cartoes">
          <section class="card cartao">
            <span class="muted">Total investido</span>
            <strong class="grande" id="total">€ 0,00</strong>
            <span class="delta" id="variacao"></span>
          </section>
          <section class="card cartao">
            <span class="muted">Rendimento (YTD)</span>
            <strong class="grande" id="rend-pct">—</strong>
            <span class="delta" id="rend-eur"></span>
          </section>
        </div>

        <section class="card painel">
          <div class="distribuicao">
            <div class="donut" id="donut"><span id="centro"></span></div>
            <ul class="legenda" id="legenda"></ul>
          </div>

          <h2>Últimos movimentos</h2>
          <div class="scroll">
            <table class="tabela cinza">
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Ativo</th>
                  <th>Tipo</th>
                  <th class="dir">Valor</th>
                </tr>
              </thead>
              <tbody id="corpo"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <dialog id="modal-ativo" class="modal">
      <form id="form-ativo">
        <h2>Adicionar investimento</h2>
        <label
          >Nome
          <input
            type="text"
            name="nome"
            maxlength="60"
            autocomplete="off"
            placeholder="Ex.: ETF World, Apple, Bitcoin"
            required
          />
        </label>
        <label
          >Classe
          <select name="classe" required></select>
        </label>
        <label
          >Conta
          <select name="conta" required></select>
        </label>
        <p class="nota" id="nota-ativo">
          O valor deste investimento é indicado no próximo «Fechar mês».
        </p>
        <p id="erro-ativo" class="erro"></p>
        <div class="modal-botoes">
          <button type="button" id="btn-cancelar" class="btn-cancelar">
            Cancelar
          </button>
          <button type="submit" class="btn-add" id="btn-guardar">
            Guardar
          </button>
        </div>
      </form>
    </dialog>

    <script src="js/sidebar.js"></script>
    <script src="js/util.js"></script>
    <script src="js/investimentos.js"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyFinance – Despesas</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/componentes.css" />
    <link rel="stylesheet" href="css/despesas.css" />
  </head>
  <body>
    <div class="app">
      <aside id="sidebar" data-ativo="despesas"></aside>

      <main class="content">
        <div class="title-row">
          <h1>Despesas</h1>
          <div class="acoes">
            <label class="mes-select">
              <select id="mes" aria-label="Mês"></select>
              <svg class="icon" viewBox="0 0 24 24">
                <path
                  d="M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM4 10h16M9 3v4M15 3v4"
                />
              </svg>
            </label>
            <button class="btn-add" id="btn-adicionar">
              <span class="mais">+</span> Adicionar despesa
            </button>
          </div>
        </div>

        <p class="aviso" id="aviso" hidden></p>

        <div class="tabs">
          <button class="tab active" data-vista="todas">Todas</button>
          <button class="tab" data-vista="categorias">Categorias</button>
        </div>

        <section class="card painel">
          <div class="resumo">
            <div class="total-bloco">
              <span class="muted">Total do mês</span>
              <strong class="total" id="total">€ 0,00</strong>
              <span class="delta" id="variacao"></span>
            </div>
            <div class="distribuicao">
              <div class="donut" id="donut"><span id="centro">€ 0</span></div>
              <ul class="legenda" id="legenda"></ul>
            </div>
          </div>

          <h2 id="titulo-tabela">Últimas despesas</h2>
          <div class="scroll">
            <table class="tabela cinza">
              <thead id="cabecalho"></thead>
              <tbody id="corpo"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <dialog id="modal-despesa" class="modal">
      <form id="form-despesa">
        <h2>Adicionar despesa</h2>
        <label
          >Mês
          <select name="mes" required></select>
        </label>
        <label
          >Categoria
          <select name="categoria" required></select>
        </label>
        <label
          >Valor (€)
          <input
            type="number"
            name="valor"
            min="0"
            step="0.01"
            inputmode="decimal"
            required
          />
        </label>
        <label
          >O que fazer ao valor
          <select name="modo">
            <option value="somar">Somar ao valor já registado</option>
            <option value="definir">
              Definir como valor do mês (corrigir)
            </option>
          </select>
        </label>
        <p class="nota" id="nota-despesa"></p>
        <p id="erro-despesa" class="erro"></p>
        <div class="modal-botoes">
          <button type="button" id="btn-cancelar" class="btn-cancelar">
            Cancelar
          </button>
          <button type="submit" class="btn-add" id="btn-guardar">
            Guardar
          </button>
        </div>
      </form>
    </dialog>

    <script src="js/sidebar.js"></script>
    <script src="js/util.js"></script>
    <script src="js/despesas.js"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyFinance–Fundo de Emergência</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/fundo-emergencia.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">MyFinance-FundoEmergencia</div>
        <nav class="menu">
          <a href="dashboard.html">Dashboard</a>
          <a href="contas.html">Contas</a><a href="despesas.html">Despesas</a>
          <a href="receitas.html">Receitas</a>
          <a href="investimentos.html">Investimentos</a>
          <a href="fundo-emergencia.html" class="active">Fundo Emergência</a>
          <a href="objetivos.html">Objetivos</a>
          <a href="despesas-anuais.html">Despesas Anuais</a>
          <a href="relatorios.html">Relatórios</a>
        </nav>
        <a href="configuracao.html" class="menu-config">Configuração</a>
      </aside>
      <main class="content">
        <div class="title-row"><h1>Fundo de Emergência</h1></div>
        <section class="card box topo">
          <div class="donut">
            <span data-campo="percentagem">—</span>
          </div>
          <dl class="info">
            <dt>Objetivo</dt>
            <dd data-campo="objetivo">—</dd>
            <dt>Contribuição mensal</dt>
            <dd data-campo="contribuicao">—</dd>
            <dt>Tempo estimado</dt>
            <dd data-campo="tempo">—</dd>
          </dl>
        </section>
        <section class="banner">
          <p data-campo="dica">—</p>
        </section>
        <article class="card box">
          <h2>Evolução</h2>
          <div class="placeholder" id="grafico-evolucao">Sem dados</div>
        </article>
      </main>
    </div>
    <script src="js/fundo-emergencia.js"></script>
  </body>
</html>

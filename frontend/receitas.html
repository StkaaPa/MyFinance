<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyFinance–Receitas</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/receitas.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">MyFinance-Receitas</div>
        <nav class="menu">
          <a href="dashboard.html">Dashboard</a>
          <a href="contas.html">Contas</a>
          <a href="despesas.html">Despesas</a>
          <a href="receitas.html" class="active">Receitas</a>
          <a href="investimentos.html">Investimentos</a>
          <a href="fundo-emergencia.html">Fundo Emergência</a>
          <a href="objetivos.html">Objetivos</a>
          <a href="despesas-anuais.html">Despesas Anuais</a>
          <a href="relatorios.html">Relatórios</a>
        </nav>
        <a href="configuracao.html" class="menu-config">Configuração</a>
      </aside>
      <main class="content">
        <div class="title-row">
          <h1>Receitas</h1>
          <button class="btn-add">Adicionar receita</button>
        </div>
        <div class="tabs">
          <button class="tab active">Todas</button>
          <button class="tab">Salário</button>
          <button class="tab">Cartão refeição</button>
          <button class="tab">Outros</button>
        </div>
        <article class="card box">
          <span class="muted">Total do mês</span>
          <strong class="grande" data-campo="total">—</strong>
          <div class="donut-wrap">
            <div class="donut">
              <span data-campo="centro">—</span>
            </div>
            <ul class="legend" id="legenda"></ul>
          </div>
        </article>
        <h2>Últimas receitas</h2>
        <section class="card tabela-card">
          <table class="tabela">
            <thead>
              <tr>
                <th>Data</th>
                <th>Descrição</th>
                <th>Categoria</th>
                <th>Valor</th>
              </tr>
            </thead>
            <tbody id="lista"></tbody>
          </table>
        </section>
      </main>
    </div>
    <script src="js/receitas.js"></script>
  </body>
</html>
